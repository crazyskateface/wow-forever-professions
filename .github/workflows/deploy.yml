name: Deploy

on:
  push:
    branches: [stage, main]

permissions: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployment commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_STAGE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web release
        run: pnpm --filter @forever-professions/web build

      - name: Assume protected environment role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 2700
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Review stage diff
        run: pnpm --filter @forever-professions/ops exec cdk diff -c "stage=${DEPLOYMENT_STAGE}"

      - name: Deploy stage stacks
        run: >-
          pnpm --filter @forever-professions/ops exec cdk deploy --all --strict
          --require-approval never
          --outputs-file "${GITHUB_WORKSPACE}/cdk-outputs.${DEPLOYMENT_STAGE}.json"
          -c "stage=${DEPLOYMENT_STAGE}"

      - name: Read application outputs
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const outputs = Object.values(JSON.parse(fs.readFileSync(process.argv[1], "utf8")));
            const application = outputs.find((value) => value.SiteBucketName && value.DistributionId);
            if (!application) throw new Error("Application stack outputs are missing");
            process.stdout.write(`SITE_BUCKET=${application.SiteBucketName}\n`);
            process.stdout.write(`DISTRIBUTION_ID=${application.DistributionId}\n`);
          ' "cdk-outputs.${DEPLOYMENT_STAGE}.json" >> "$GITHUB_ENV"

      - name: Publish web release
        shell: bash
        run: |
          aws s3 sync apps/web/dist "s3://${SITE_BUCKET}" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=86400" \
            --only-show-errors
          aws s3 cp apps/web/dist/index.html "s3://${SITE_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
