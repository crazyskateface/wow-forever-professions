name: AWS identity check

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected AWS environment to verify
        required: true
        type: choice
        options:
          - staging
          - production

permissions: {}

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  identity:
    name: Verify ${{ inputs.environment }} AWS identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume protected environment role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          role-duration-seconds: 1800
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify caller and account
        shell: bash
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account_id" = "$EXPECTED_ACCOUNT_ID"
          aws sts get-caller-identity
